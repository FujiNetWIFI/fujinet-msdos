name: Build fujinet.sys

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    # Do not build release branch
    branches:
      - "**"
      - "!release"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Get short SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Git Safe Directory
        run: git config --global --add safe.directory ${{ github.workspace }}

      - name: Install nasm
        run: sudo apt-get install -y nasm

      - name: Setup Watcom
        uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"
          target: dos

      - name: Build fujinet.sys
        run: |
          make
          cp sys/fujinet.sys sys/fujinet-${{ steps.short-sha.outputs.sha }}.sys

      # Separate step on purpose: a machine driver that fails to build shows
      # up as its own red step and cannot mask a PC build failure.
      - name: Build non-PC machine drivers
        run: |
          make machines
          for m in fnvic9k fnapric fnaprf fnsanyo fnt2000; do
            cp sys/$m.sys sys/$m-${{ steps.short-sha.outputs.sha }}.sys
          done

      - name: Bump version and push tag
        id: tag-version
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: laputansoft/github-tag-action@v4.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          body: |
            `fujinet.sys` MS-DOS driver for RS232 FujiNet

            Drivers for non-IBM-PC MS-DOS machines:

            | Machine | Driver |
            |---------|--------|
            | Victor 9000 / ACT Sirius 1 | `fnvic9k.sys` |
            | Apricot PC / Xi | `fnapric.sys` |
            | Apricot F1 / F2 / F10 | `fnaprf.sys` |
            | Sanyo MBC-550 / 555 | `fnsanyo.sys` |
            | Tandy 2000 | `fnt2000.sys` |
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.tag-version.outputs.new_tag }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: ${{ github.workspace }}/sys/*-${{ steps.short-sha.outputs.sha }}.sys
          generate_release_notes: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
